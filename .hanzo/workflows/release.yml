name: Release
# Publishes tabs.hanzo.ai.
#
# Tabs is a STATIC EXPORT, so a release is a bucket sync, not an image build. The
# server in front of it is hanzoai/static, pinned in the operator values file and
# released on its own cadence — so building a container here produced an image
# that nothing deployed, and the only way a change ever reached the site was by
# hand. That is what this replaces.
#
# The endpoint is the PUBLIC s3.hanzo.ai, not the in-cluster service address the
# serving pod uses: these runners are not in the cluster. Same bucket, same
# bytes, different door.
#
# Runs on the forge (git.hanzo.ai) native runners — see hanzoai/app/release.yml.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.hanzo/workflows/**']
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: release-tabs, cancel-in-progress: false }
jobs:
  publish:
    runs-on: [hanzo-build-linux-amd64]
    env:
      BUCKET: tabs
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: The layout engine and the bindings
        run: npm test
      - name: Export
        run: npm run build

      # A build that emitted no app page is a green run that publishes a blank
      # site. Caught here rather than in a browser.
      - name: The export is complete
        run: |
          set -euo pipefail
          for f in index.html app/index.html auth/callback/index.html; do
            [ -s "out/$f" ] || { echo "::error::missing or empty: out/$f"; exit 1; }
          done

      - name: Publish to the tabs bucket
        # The credential comes from KMS, not from repo secrets. `SITES_S3_*` —
        # the names this used to read — are in no org and in no KMS project, so
        # the step failed closed on every run since it was written and tabs could
        # only be updated by hand. Same pair the serving pod reads (k8s secret
        # `s3-credentials`), so CI and the server agree on one identity.
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
          KMS_SECRET_ENV: ${{ vars.KMS_SECRET_ENV || 'prod' }}
        run: |
          set -euo pipefail
          # The org rides the TOKEN, so the secret path is flat. An org-segmented
          # /v1/kms/orgs/<org>/secrets/... answers 404, and `curl -fsS` reports
          # that as a bare exit 22 that `set -e` turns into a step death with no
          # message naming which call failed.
          KMS_TOKEN=$(curl -fsS "${KMS_ENDPOINT}/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"${KMS_CLIENT_ID}\",\"clientSecret\":\"${KMS_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken // empty')
          [ -n "$KMS_TOKEN" ] || { echo "::error::KMS login failed at ${KMS_ENDPOINT} — check KMS_CLIENT_ID/KMS_CLIENT_SECRET on this org"; exit 1; }
          kms() { curl -fsS "${KMS_ENDPOINT}/v1/kms/secrets/s3-credentials/$1?env=${KMS_SECRET_ENV}" -H "Authorization: Bearer ${KMS_TOKEN}" | jq -r '.value // empty'; }
          AWS_ACCESS_KEY_ID=$(kms access-key)
          AWS_SECRET_ACCESS_KEY=$(kms secret-key)
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::s3-credentials/{access-key,secret-key} missing in KMS (env ${KMS_SECRET_ENV}) — cannot sync."
            exit 1
          fi
          echo "::add-mask::${AWS_ACCESS_KEY_ID}"
          echo "::add-mask::${AWS_SECRET_ACCESS_KEY}"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          # The runner image ships no aws CLI and nothing in the reusable
          # provisions one, so install it here or the step dies `aws: command
          # not found` (exit 127) with a perfectly good credential in hand.
          command -v aws > /dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq awscli
          }
          aws --version
          # Assets first, HTML second, and the order is the point: the hashed
          # _next/ files are immutable and safe to cache forever, while the HTML
          # that names them must never be cached. Publishing the HTML first would
          # briefly serve a page pointing at chunks that are not up yet.
          aws s3 sync out/ "s3://${BUCKET}/" \
            --endpoint-url https://s3.hanzo.ai --only-show-errors \
            --exclude '*.html' --exclude '*.txt' \
            --cache-control 'public,max-age=31536000,immutable'
          # --delete so a page removed from the export stops being served;
          # without it the bucket only ever grows.
          aws s3 sync out/ "s3://${BUCKET}/" \
            --endpoint-url https://s3.hanzo.ai --only-show-errors \
            --delete --cache-control 'no-cache'

      - name: Tag the release
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          max="$(git tag -l 'v0.1.*' | sed 's/^v//' | sort -V | tail -1 || true)"
          [ -n "$max" ] || max="0.1.0"
          v="v0.1.$(( ${max##*.} + 1 ))"
          git tag "$v"
          git push origin "$v"

