name: Release
# Cuts ghcr.io/hanzoai/tabs, which the operator values file pins.
# Runs on the forge (git.hanzo.ai) native runners — see hanzoai/app/release.yml.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.hanzo/workflows/**']
  workflow_dispatch:
permissions: { contents: write, packages: write }
concurrency: { group: release-tabs, cancel-in-progress: false }
jobs:
  test:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: The layout engine and the bindings
        run: npm test
  release:
    needs: test
    runs-on: [hanzo-build-linux-amd64]
    env: { GH_PAT: '${{ secrets.GH_PAT }}' }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Compute the next patch over the 0.1.x line
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          max="$(git tag -l 'v0.1.*' | sed 's/^v//' | sort -V | tail -1 || true)"
          [ -n "$max" ] || max="0.1.0"
          echo "version=0.1.$(( ${max##*.} + 1 ))" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: hanzo-dev
          password: ${{ secrets.GH_PAT }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/hanzoai/tabs:v${{ steps.ver.outputs.version }},ghcr.io/hanzoai/tabs:latest
      - name: Tag the release
        run: |
          set -euo pipefail
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"
